<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridPulse — feeder monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --enamel:      #a9b0a5;
    --enamel-dark: #8d958a;
    --frame:       #2a2e2a;
    --legend:      #ece7da;
    --ink:         #191c19;
    --ink-soft:    #5c635b;
    --lamp-amber:  #e2a02c;
    --lamp-red:    #be3a24;
    --lamp-green:  #3e7a5c;
    --paper:       #f6f1e4;
    --rule:        #c4705a;
    --trace-1:     #1d4f5c;
    --trace-2:     #7a4f86;
    --trace-3:     #2f6b3f;
    --trace-4:     #94561f;

    --plate: 2px;
  }

  * { box-sizing: border-box; }

  html { background: var(--enamel); }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--ink);
    background:
      repeating-linear-gradient(
        180deg,
        rgba(0,0,0,.028) 0 1px,
        transparent 1px 3px
      ),
      var(--enamel);
  }

  .legend-type {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .14em;
    font-weight: 600;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- header rail ---------- */

  header {
    background: var(--frame);
    color: var(--legend);
    border-bottom: 3px solid #14170f;
    padding: 0 clamp(12px, 3vw, 28px);
    display: flex;
    align-items: center;
    gap: 18px;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header h1 {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .22em;
    font-weight: 700;
    font-size: 20px;
    margin: 0;
  }

  header .sub {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #9aa396;
    border-left: 1px solid #4a504a;
    padding-left: 18px;
  }

  header .spacer { flex: 1; }

  .link-state {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #9aa396;
  }

  .pip {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--lamp-green);
    box-shadow: 0 0 6px rgba(62,122,92,.9);
  }
  .pip.down { background: var(--lamp-red); box-shadow: 0 0 6px rgba(190,58,36,.9); }

  @media (prefers-reduced-motion: no-preference) {
    .pip { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .35; } }
  }

  /* ---------- layout ---------- */

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(16px, 3vw, 30px) clamp(12px, 3vw, 28px) 60px;
    display: grid;
    gap: 26px;
  }

  section > .rail {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 12px;
  }

  .rail h2 {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .2em;
    font-weight: 700;
    font-size: 14px;
    margin: 0;
  }

  .rail .note {
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: .04em;
  }

  .rail .spacer { flex: 1; }

  /* ---------- annunciator tiles ---------- */

  .annunciator {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 12px;
  }

  .tile {
    position: relative;
    background: var(--legend);
    border: var(--plate) solid var(--frame);
    border-radius: 2px;
    padding: 12px 14px 13px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 0 rgba(0,0,0,.16);
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: default;
    display: grid;
    gap: 9px;
  }

  .tile.alarm  { background: #f6dcae; border-color: #7a5410; }
  .tile.alarm.active { background: var(--lamp-amber); }
  .tile.trip   { background: #efbdb1; border-color: #6d2115; }
  .tile.trip.active  { background: var(--lamp-red); color: var(--legend); }
  .tile.offline { background: var(--enamel-dark); border-color: #4a504a; color: #3d443c; }

  @media (prefers-reduced-motion: no-preference) {
    .tile.active { animation: lamp 1.1s steps(1, end) infinite; }
    @keyframes lamp { 50% { filter: brightness(.78); } }
  }

  .tile-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid rgba(25,28,25,.22);
    padding-bottom: 7px;
  }

  .tile-id {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .16em;
    font-weight: 700;
    font-size: 15px;
  }

  .tile-state {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .13em;
    font-weight: 600;
    font-size: 10.5px;
    opacity: .82;
  }

  .readout {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
  }

  .readout dt {
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .62;
    align-self: center;
  }

  .readout dd { margin: 0; font-weight: 500; }

  .latch {
    justify-self: start;
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border: 1px solid currentColor;
    border-radius: 2px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    opacity: .8;
  }
  .latch:hover { opacity: 1; }
  .latch:focus-visible { outline: 2px solid var(--frame); outline-offset: 2px; }

  /* ---------- chart recorder ---------- */

  .recorder {
    background: var(--paper);
    border: var(--plate) solid var(--frame);
    border-radius: 2px;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 2px 0 rgba(0,0,0,.16);
  }

  .recorder svg { display: block; width: 100%; height: auto; }

  .metric-picker { display: flex; gap: 6px; }

  .metric-picker button {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: .12em;
    font-weight: 600;
    font-size: 10.5px;
    padding: 5px 11px;
    border: 1px solid var(--frame);
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .metric-picker button[aria-pressed="true"] {
    background: var(--frame);
    color: var(--legend);
  }
  .metric-picker button:focus-visible { outline: 2px solid var(--frame); outline-offset: 2px; }

  .key {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin-top: 9px;
    font-size: 11px;
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink-soft);
  }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }

  /* ---------- lower panels ---------- */

  .split {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 26px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .split { grid-template-columns: 1fr; }
  }

  .sheet {
    background: var(--legend);
    border: var(--plate) solid var(--frame);
    border-radius: 2px;
    box-shadow: 0 2px 0 rgba(0,0,0,.16);
    overflow: hidden;
  }

  .log { max-height: 320px; overflow-y: auto; }

  .log-row {
    display: grid;
    grid-template-columns: 74px 62px 1fr;
    gap: 10px;
    padding: 8px 13px;
    border-bottom: 1px solid rgba(25,28,25,.11);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    align-items: baseline;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row .t { color: var(--ink-soft); }
  .log-row .who { font-weight: 600; }
  .log-row .what { display: flex; gap: 8px; align-items: baseline; }

  .sev {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex: none;
    transform: translateY(-1px);
  }
  .sev.warning  { background: var(--lamp-amber); }
  .sev.critical { background: var(--lamp-red); }

  .empty {
    padding: 26px 14px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  .score { padding: 15px 16px 17px; display: grid; gap: 13px; }

  .score-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .big {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
  }

  .score-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
  }
  .score-grid div { display: flex; justify-content: space-between; gap: 10px; }
  .score-grid span:first-child { color: var(--ink-soft); }

  .caption {
    font-size: 11px;
    line-height: 1.5;
    color: var(--ink-soft);
    border-top: 1px solid rgba(25,28,25,.16);
    padding-top: 10px;
  }

  footer {
    color: #6f766d;
    font-size: 11px;
    letter-spacing: .04em;
    text-align: center;
    padding-bottom: 30px;
  }
</style>
</head>
<body>

<header>
  <h1>GridPulse</h1>
  <div class="sub">11 kV feeder monitoring</div>
  <div class="spacer"></div>
  <div class="link-state">
    <span class="pip" id="pip"></span>
    <span id="link-text">connecting</span>
  </div>
</header>

<main>

  <section>
    <div class="rail">
      <h2>Annunciator</h2>
      <span class="note">tiles latch on alarm — clear to reset</span>
      <span class="spacer"></span>
      <span class="note mono" id="sensor-count"></span>
    </div>
    <div class="annunciator" id="tiles"></div>
  </section>

  <section>
    <div class="rail">
      <h2>Chart recorder</h2>
      <span class="note">trailing 60 s</span>
      <span class="spacer"></span>
      <div class="metric-picker" id="picker">
        <button data-metric="voltage_v" aria-pressed="true">Voltage</button>
        <button data-metric="current_a" aria-pressed="false">Current</button>
        <button data-metric="frequency_hz" aria-pressed="false">Frequency</button>
      </div>
    </div>
    <div class="recorder">
      <svg id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none" role="img"
           aria-label="Scrolling chart of sensor measurements"></svg>
    </div>
    <div class="key" id="key"></div>
  </section>

  <section class="split">
    <div>
      <div class="rail"><h2>Event log</h2><span class="note">detected from measurements</span></div>
      <div class="sheet log" id="log"></div>
    </div>
    <div>
      <div class="rail"><h2>Detector score</h2></div>
      <div class="sheet">
        <div class="score" id="score"></div>
      </div>
    </div>
  </section>

</main>

<footer class="mono">GridPulse — C sensor simulator › Go collector › PostgreSQL › FastAPI</footer>

<script>
(() => {
  "use strict";

  const NOMINAL = { voltage_v: 11000, current_a: 180, frequency_hz: 50 };
  const UNITS   = { voltage_v: "V", current_a: "A", frequency_hz: "Hz" };
  const LABELS  = { voltage_v: "Voltage", current_a: "Current", frequency_hz: "Frequency" };
  const TRACES  = ["var(--trace-1)", "var(--trace-2)", "var(--trace-3)", "var(--trace-4)"];
  const WINDOW_S = 60;

  let metric = "voltage_v";
  const latched = new Map();   // sensor_id -> "alarm" | "trip"
  let sensorOrder = [];

  const $ = (id) => document.getElementById(id);

  const fmt = (v, m) =>
    m === "frequency_hz" ? v.toFixed(3)
    : m === "voltage_v"  ? v.toLocaleString(undefined, { maximumFractionDigits: 0 })
    : v.toFixed(1);

  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour12: false });

  const colourFor = (id) => {
    const i = sensorOrder.indexOf(id);
    return TRACES[(i < 0 ? 0 : i) % TRACES.length];
  };

  async function get(path) {
    const res = await fetch(path, { cache: "no-store" });
    if (!res.ok) throw new Error(path + " → " + res.status);
    return res.json();
  }

  function setLink(ok, detail) {
    $("pip").classList.toggle("down", !ok);
    $("link-text").textContent = ok ? "live" : (detail || "no link");
  }

  /* ---------- annunciator ---------- */

  function severityOf(s) {
    if (!s.online) return "offline";
    const r = s.latest;
    if (!r) return "offline";
    const vRatio = r.voltage_v / NOMINAL.voltage_v;
    const fDrift = Math.abs(r.frequency_hz - NOMINAL.frequency_hz);
    if (vRatio < 0.80 || fDrift > 0.5) return "trip";
    if (vRatio < 0.90 || vRatio > 1.10) return "alarm";
    return "normal";
  }

  function renderTiles(sensors) {
    sensorOrder = sensors.map((s) => s.sensor_id);
    $("sensor-count").textContent =
      sensors.filter((s) => s.online).length + " / " + sensors.length + " online";

    const host = $("tiles");
    if (!sensors.length) {
      host.innerHTML = '<div class="empty">No sensors reporting. Start the collector and simulator.</div>';
      return;
    }

    host.innerHTML = "";
    for (const s of sensors) {
      const live = severityOf(s);
      if (live === "trip" || live === "alarm") latched.set(s.sensor_id, live);
      const held = latched.get(s.sensor_id);
      const cls = live === "offline" ? "offline" : (held || "normal");

      const tile = document.createElement("div");
      tile.className = "tile " + (cls === "normal" ? "" : cls) +
                       (live === "trip" || live === "alarm" ? " active" : "");

      const stateText =
        live === "offline" ? "no signal" :
        live === "trip"    ? "trip" :
        live === "alarm"   ? "alarm" :
        held               ? "latched" : "normal";

      const r = s.latest || { voltage_v: 0, current_a: 0, frequency_hz: 0 };

      tile.innerHTML = `
        <div class="tile-head">
          <span class="tile-id">Feeder ${s.sensor_id}</span>
          <span class="tile-state">${stateText}</span>
        </div>
        <dl class="readout">
          <dt>V</dt><dd>${fmt(r.voltage_v, "voltage_v")} V</dd>
          <dt>I</dt><dd>${fmt(r.current_a, "current_a")} A</dd>
          <dt>f</dt><dd>${fmt(r.frequency_hz, "frequency_hz")} Hz</dd>
        </dl>`;

      if (held && live !== "trip" && live !== "alarm") {
        const btn = document.createElement("button");
        btn.className = "latch";
        btn.textContent = "Clear";
        btn.addEventListener("click", () => {
          latched.delete(s.sensor_id);
          tick();
        });
        tile.appendChild(btn);
      }
      host.appendChild(tile);
    }
  }

  /* ---------- chart recorder ---------- */

  function renderChart(rows) {
    const svg = $("chart");
    const W = 1000, H = 300, L = 62, R = 16, T = 16, B = 26;
    const plotW = W - L - R, plotH = H - T - B;

    if (!rows.length) {
      svg.innerHTML =
        `<rect width="${W}" height="${H}" fill="var(--paper)"></rect>
         <text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-family="IBM Plex Mono, monospace"
               font-size="13" fill="#8b8375">Waiting for readings…</text>`;
      $("key").innerHTML = "";
      return;
    }

    const now = Date.now();
    const t0 = now - WINDOW_S * 1000;

    const bySensor = new Map();
    for (const r of rows) {
      if (!bySensor.has(r.sensor_id)) bySensor.set(r.sensor_id, []);
      bySensor.get(r.sensor_id).push(r);
    }

    const values = rows.map((r) => r[metric]);
    let lo = Math.min(...values), hi = Math.max(...values);
    const nominal = NOMINAL[metric];
    lo = Math.min(lo, nominal); hi = Math.max(hi, nominal);
    const pad = (hi - lo) * 0.12 || Math.abs(nominal) * 0.01 || 1;
    lo -= pad; hi += pad;

    const x = (iso) => L + ((new Date(iso).getTime() - t0) / (WINDOW_S * 1000)) * plotW;
    const y = (v) => T + plotH - ((v - lo) / (hi - lo)) * plotH;

    const parts = [`<rect width="${W}" height="${H}" fill="var(--paper)"></rect>`];

    // chart paper: fine grid, heavier every fifth line
    for (let i = 0; i <= 50; i++) {
      const gx = L + (i / 50) * plotW;
      const major = i % 5 === 0;
      parts.push(`<line x1="${gx}" y1="${T}" x2="${gx}" y2="${T + plotH}"
        stroke="var(--rule)" stroke-width="${major ? 0.7 : 0.35}" opacity="${major ? .38 : .2}"/>`);
    }
    for (let i = 0; i <= 10; i++) {
      const gy = T + (i / 10) * plotH;
      const major = i % 5 === 0;
      parts.push(`<line x1="${L}" y1="${gy}" x2="${L + plotW}" y2="${gy}"
        stroke="var(--rule)" stroke-width="${major ? 0.7 : 0.35}" opacity="${major ? .38 : .2}"/>`);
      const val = lo + (1 - i / 10) * (hi - lo);
      parts.push(`<text x="${L - 9}" y="${gy + 3.5}" text-anchor="end"
        font-family="IBM Plex Mono, monospace" font-size="10" fill="#7d7566">${fmt(val, metric)}</text>`);
    }

    // nominal reference
    parts.push(`<line x1="${L}" y1="${y(nominal)}" x2="${L + plotW}" y2="${y(nominal)}"
      stroke="#2a2e2a" stroke-width="1" stroke-dasharray="7 5" opacity=".55"/>`);
    parts.push(`<text x="${L + plotW - 4}" y="${y(nominal) - 6}" text-anchor="end"
      font-family="Saira Condensed, sans-serif" font-size="10" letter-spacing="1.4"
      fill="#2a2e2a" opacity=".72">NOMINAL ${fmt(nominal, metric)} ${UNITS[metric]}</text>`);

    // pen traces
    for (const [sid, series] of bySensor) {
      series.sort((a, b) => new Date(a.time) - new Date(b.time));
      const d = series
        .map((r, i) => (i ? "L" : "M") + x(r.time).toFixed(1) + " " + y(r[metric]).toFixed(1))
        .join(" ");
      parts.push(`<path d="${d}" fill="none" stroke="${colourFor(sid)}"
        stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>`);

      const last = series[series.length - 1];
      parts.push(`<circle cx="${x(last.time).toFixed(1)}" cy="${y(last[metric]).toFixed(1)}"
        r="3.2" fill="${colourFor(sid)}"/>`);
    }

    // time axis
    for (let s = 0; s <= WINDOW_S; s += 15) {
      const gx = L + (s / WINDOW_S) * plotW;
      parts.push(`<text x="${gx}" y="${H - 8}" text-anchor="middle"
        font-family="IBM Plex Mono, monospace" font-size="10"
        fill="#7d7566">${s === WINDOW_S ? "now" : "-" + (WINDOW_S - s) + "s"}</text>`);
    }

    svg.innerHTML = parts.join("");

    $("key").innerHTML = [...bySensor.keys()].sort((a, b) => a - b).map((sid) =>
      `<span><i style="background:${colourFor(sid)}"></i>Feeder ${sid}</span>`
    ).join("") + `<span style="margin-left:auto">${LABELS[metric]} · ${UNITS[metric]}</span>`;
  }

  /* ---------- event log ---------- */

  function renderLog(data) {
    const host = $("log");
    const items = data.anomalies || [];
    if (!items.length) {
      host.innerHTML = '<div class="empty">No anomalies in the last 60 s.</div>';
      return;
    }
    host.innerHTML = items.slice(0, 60).map((a) => `
      <div class="log-row">
        <span class="t">${clock(a.at)}</span>
        <span class="who">F${a.sensor_id}</span>
        <span class="what"><i class="sev ${a.severity}"></i>${a.detail}</span>
      </div>`).join("");
  }

  /* ---------- detector score ---------- */

  function renderScore(s) {
    $("score").innerHTML = `
      <div class="score-head">
        <span class="big">${(s.f1 * 100).toFixed(0)}<span style="font-size:15px">%</span></span>
        <span class="legend-type" style="font-size:10.5px;color:var(--ink-soft)">F1 · last 5 min</span>
      </div>
      <div class="score-grid">
        <div><span>precision</span><span>${s.precision.toFixed(3)}</span></div>
        <div><span>recall</span><span>${s.recall.toFixed(3)}</span></div>
        <div><span>caught</span><span>${s.true_positives}</span></div>
        <div><span>missed</span><span>${s.false_negatives}</span></div>
        <div><span>false alarms</span><span>${s.false_positives}</span></div>
        <div><span>samples</span><span>${s.samples}</span></div>
      </div>
      <p class="caption">Scored against the fault flag set by the sensor firmware.
      The detector never reads that flag — it works only from measured voltage
      and frequency, so this is a fair test of the thresholds.</p>`;
  }

  /* ---------- polling ---------- */

  let scoreDue = 0;

  async function tick() {
    try {
      const [sensors, rows, events] = await Promise.all([
        get("/api/sensors?window_s=120"),
        get(`/api/readings?seconds=${WINDOW_S}&limit=3000`),
        get(`/api/anomalies?seconds=${WINDOW_S}&limit=60`),
      ]);
      renderTiles(sensors);
      renderChart(rows);
      renderLog(events);
      setLink(true);

      if (Date.now() > scoreDue) {
        scoreDue = Date.now() + 10000;
        try { renderScore(await get("/api/detector-score?seconds=300")); }
        catch { $("score").innerHTML = '<div class="empty">Not enough data yet.</div>'; }
      }
    } catch (err) {
      setLink(false, "api unreachable");
    }
  }

  $("picker").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-metric]");
    if (!btn) return;
    metric = btn.dataset.metric;
    for (const b of $("picker").children) {
      b.setAttribute("aria-pressed", String(b === btn));
    }
    tick();
  });

  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
